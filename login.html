<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login – Inkwell</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <a href="index.html" class="logo">Inkwell</a>
    <nav>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="products.html">Shop</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li><a href="login.html">Login</a></li>
        <li><a href="cart.html" class="cart-link">Cart</a></li>
      </ul>
    </nav>
  </header>
  <main>
    <section class="section">
      <div class="two-col">
        <form class="form" action="index.html" method="get">
          <h2>Login</h2>
          <label for="le">Email</label>
          <input type="email" id="le" name="email" required>
          <label for="lp">Password</label>
          <input type="password" id="lp" name="password" required>
          <button type="submit" class="btn">Login</button>
        </form>
        <form class="form" action="index.html" method="get">
          <h2>Create account</h2>
          <label for="rn">Full name</label>
          <input type="text" id="rn" name="name" required>
          <label for="re">Email</label>
          <input type="email" id="re" name="email" required>
          <label for="rp">Password (min 6 characters)</label>
          <input type="password" id="rp" name="password" minlength="6" required>
          <button type="submit" class="btn">Register</button>
        </form>
      </div>
    </section>
  </main>
  <footer class="site-footer">
    <p>© 2026 Inkwell. A practice project built with HTML5 and CSS.</p>
    <p><a href="products.html">Shop</a> · <a href="cart.html">Cart</a> · <a href="contact.html">Contact</a></p>
  </footer>
</body>
</html>
